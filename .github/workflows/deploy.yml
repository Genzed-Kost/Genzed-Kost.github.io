name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Tidak pakai cache: npm di sini karena portal/package-lock.json belum
          # pernah di-generate (belum ada Node.js di mesin dev). Setelah lockfile
          # ada & di-commit, boleh tambah lagi `cache: npm` + cache-dependency-path
          # buat mempercepat build.

      - name: Install dependency portal
        working-directory: portal
        run: npm install

      - name: Build portal (Vite)
        working-directory: portal
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Susun folder hasil publish
        run: |
          mkdir -p publish
          # Landing page statis — disalin apa adanya, TIDAK diproses Vite.
          cp index.html publish/
          cp 404.html publish/
          cp logo.png publish/
          cp logo.svg publish/
          cp robots.txt publish/
          cp sitemap.xml publish/
          # Hasil build portal (React) masuk ke subfolder /app/.
          mkdir -p publish/app
          cp -r portal/dist/* publish/app/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
